@if (isLoading()) {
  <zen-money-loading></zen-money-loading>
}

<zen-unauthenticated-common-layout>
  <form [formGroup]="signUpForm" (ngSubmit)="registerUser($event)">
    <zen-input-text
      [ariaLabel]="'Campo para inserir o nome'"
      [label]="'Nome'"
      [placeholder]="'Insira seu nome'"
      [required]="true"
      [errorMessages]="getErrorMessages('name')"
      [isValid]="isValid('name')"
      [isInvalid]="isInvalid('name')"
      type="text"
      formControlName="name"
      role="textbox"
    ></zen-input-text>

    <zen-input-text
      [ariaLabel]="'Campo para inserir o email'"
      [label]="'Email'"
      [placeholder]="'Insira seu email'"
      [required]="true"
      [errorMessages]="getErrorMessages('email')"
      [isValid]="isValid('email')"
      [isInvalid]="isInvalid('email')"
      formControlName="email"
      role="textbox"
      type="email"
    ></zen-input-text>

    <zen-input-text
      [ariaLabel]="'Campo para inserir o telefone'"
      [label]="'Telefone'"
      [placeholder]="'(85) 9 9999-9999'"
      [required]="true"
      [errorMessages]="getErrorMessages('phone')"
      formControlName="phone"
      [isPhone]="true"
      [isValid]="isValid('phone')"
      [isInvalid]="isInvalid('phone')"
      role="textbox"
      type="text"
    ></zen-input-text>

    <zen-input-password
      [ariaLabel]="'Campo para inserir a senha'"
      [label]="'Senha'"
      [placeholder]="'********'"
      [required]="true"
      [errorMessages]="getErrorMessages('password')"
      [isValid]="isValid('password')"
      [isInvalid]="isInvalid('password')"
      formControlName="password"
      role="textbox"
    ></zen-input-password>

    <zen-input-password
      [ariaLabel]="'Campo para inserir a senha novamente para confirmação'"
      [label]="'Confirme sua senha'"
      [placeholder]="'********'"
      [required]="true"
      [errorMessages]="getErrorMessages('confirmPassword')"
      [isValid]="isValid('confirmPassword')"
      [isInvalid]="isInvalid('confirmPassword')"
      formControlName="confirmPassword"
      role="textbox"
    ></zen-input-password>

    <div class="btn-actions">
      <zen-primary-button
        type="submit"
        [textButton]="'Cadastrar'"
        [disabled]="isLoading()"
      ></zen-primary-button>

      <div class="divider">
        <div class="divider__divider-item--first"></div>
        <div class="divider__divider-item--text">OU</div>
        <div class="divider__divider-item--last"></div>
      </div>

      <zen-secondary-button
        type="button"
        [textButton]="'Login'"
        [disabled]="false"
        (onButtonClicked)="navigateToLogin()"
      ></zen-secondary-button>
    </div>
  </form>
</zen-unauthenticated-common-layout>
