<zen-page-container id="page-container-expenses">
  <div class="period-navigation">
    <button (click)="goToPreviousMonth()" class="nav-btn">
      <i class="bi bi-caret-left-fill"></i>
      {{ previousPeriodDisplay }}
    </button>
    <div class="current-period">
      <h2>{{ currentPeriodDisplay }}</h2>
      <span class="comparison-label">
          vs {{ previousPeriodDisplay }}
        </span>
    </div>
    <button (click)="goToNextMonth()" class="nav-btn">
      {{ nextPeriodDisplay }}
      <i class="bi bi-caret-right-fill"></i>
    </button>
  </div>

  <div class="financial-summary">
    @for (summary of financialSummary; track $index) {
      <div class="card">
        <span class="card__title">{{ summary.title }}</span>
        <div class="card__value-wrapper">
          <span class="card__value">{{ summary.value | currency: 'BRL' }}</span>
          <div class="card__icon" [class]="summary.iconColor">
            <img [ngSrc]="summary.icon" [alt]="'resumo de ' + summary.title " width="25" height="25"/>
          </div>
        </div>
        <span class="card__comparison" [class]="summary.percentageColor">{{ summary.percentage }}</span>
      </div>
    }
  </div>

  @if (comparisonChartData()) {
    <div class="comparison-chart-section">
      <h3>Comparativo Mensal</h3>
      <div class="chart-container">
        <canvas
          baseChart
          [data]="comparisonChartData()"
          [type]="'bar'"
          [options]="chartOptions()">
        </canvas>
      </div>
    </div>
  }

  <div class="details">
    <div>
      <zen-bar-chart [currentCategories]="currentCategories" [previousCategories]="previousCategories" />
    </div>

    <zen-category-details [categories]="categories" />
  </div>
</zen-page-container>
