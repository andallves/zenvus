<div>
  <div class="body-pop-up">
    <p>
      Deseja realmente excluir a receita:
      <span id="income-name">{{ truncateText(income().description) }}</span> ?
    </p>
  </div>

  <div class="footer-modal">
    <zen-button
      id="button-fechar"
      variant="danger"
      width="100px"
      (click)="onCloseModal()"
      [buttonId]="'button-fechar'"
    >
      Fechar
    </zen-button>
    <zen-button
      id="button-confirmar"
      width="100px"
      [isLoading]="isLoading()"
      (click)="deleteIncome()"
      [buttonId]="'button-salvar'"
    >
      Confirmar
    </zen-button>
  </div>
</div>
