<zen-page-container id="page-container-cursos">
  <zen-header-table
    title="Filtros"
    [mobileTitle]="'Categorias'"
    [mobileTitleIcon]="imgCursos"
    (onAdd)="openAddModal()"
    [uniqueId]="'categories'"
  />

  <zen-filter
    [filterId]="'filter-categories'"
    [isLoadingFilter]="isLoadingFilter"
    [isLoadingClearFilter]="isLoadingClearFilter"
    (onFilter)="onSearch()"

    (onClearFilter)="onClearFilter()"
  >
    <form id="form-filter-cursos" class="teste" action="javascript:void(0)" [formGroup]="filterForm">
      <zen-input
        id="input-name"
        label="Nome:"
        placeholder="Digite o nome"
        formControlName="name"

        [inputId]="'input-nome'"
      />

      <zen-color-picker-input
        id="input-color"
        label="Cor:"
        placeholder="#000000"
        formControlName="color"
        [inputId]="'input-color-picker'"/>
    </form>
  </zen-filter>

  <zen-table
    id="table-categories"
    [columns]="categoryColumn"
    [data]="categoriesData"
    (edit)="openEditModal($event)"
    (delete)="openDeleteModal($event)"
    (pageChange)="onPageChange($event)"
    [totalItens]="totalItens"
  />
</zen-page-container>

<ng-template #formAddTemplate>
  <zen-add-category-form id="form-add-category" (changeData)="changeData()"/>
</ng-template>

<ng-template #formEditTemplate>
  <zen-edit-category-form id="form-edit-category" [dataCategory]="dataCategory" (changeData)="changeData()"/>
</ng-template>

<ng-template #deleteTemplate>
  <zen-delete-template id="template-delete-category" [dataCategory]="dataCategory" (changeData)="changeData()"/>
</ng-template>
