<div
  class="skeleton"
  [class]="className"
  [style.width]="width"
  [style.height]="height"
  [style.margin]="margin"
  [style.border-radius]="borderRadius"
  [style.background-color]="backgroundColor"
  role="alert"
  aria-live="polite"
  [attr.aria-label]="ariaLabel || 'Carregando conteúdo'"
>
  <div class="skeleton-content"></div>
</div>
