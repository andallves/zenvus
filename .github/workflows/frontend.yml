name: Deploy Frontend - Cloud Run

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'ui/**' # Só roda se mexer na pasta UI
  pull_request:
    branches: [ "main", "development" ]

jobs:
  build-and-deploy:
    # Só faz deploy se for push (PR apenas testa o build se quiser)
  
    runs-on: ubuntu-latest
    environment: gcp-staging

    env:
      IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zenvus-ux
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
      REPO_NAME: zenvus-ux  # Nome do repositório criado no Passo 1
      SERVICE_NAME: zenvus-ux

    steps:
      - uses: actions/checkout@v4

      # 1. Autenticação Google
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # 2. Setup GCloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 3. Configura Docker
      - name: Configure Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME -f ui/deployment/Dockerfile ui


      - name: Push Docker Image
        run: docker push $IMAGE_NAME

      # 6. Deploy no Cloud Run
      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying to $SERVICE_NAME..."
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_NAME \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --memory 256Mi \
            --min-instances 0 \
            --max-instances 1 \
            --quiet

      # 7. Exibe a URL final
      - name: Show URL
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)')
          echo "✅ Deployed successfully to: $URL"