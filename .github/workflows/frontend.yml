name: Deploy Frontend to GCP

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'ui/**'  # Monitora mudanças no diretório ui/
  pull_request:
    branches: [ "main", "development" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  NODE_VERSION: '20'
  BUCKET_NAME: 'zenvus-app-${{ github.ref == ''refs/heads/main'' && ''prod'' || ''staging'' }}'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'  # CORRIGIDO: ui/ em vez de frontend/

      - name: Install dependencies
        working-directory: ./ui  # CORRIGIDO: Trabalha no diretório ui/
        run: npm install --legacy-peer-deps

      - name: Run lint and tests
        working-directory: ./ui
        continue-on-error: true
        run: |
          npm run lint || echo "Lint completed"
          npm test:ci  || echo "Tests completed"

      - name: Build Angular
        working-directory: ./ui
        run: |
          npm run build:dev
        env:
          NG_APP_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.API_URL_PROD || secrets.API_URL_STAGING }}
          NG_APP_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          NG_APP_VERSION: ${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: ui/dist/ui/**  # CORRIGIDO: ui/dist/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
  
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_CREDENTIALS }}
          export_default_credentials: true

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: angular-build
          path: ./deploy-files  # Baixa para uma pasta específica

      - name: Debug - Ver estrutura de arquivos
        run: |
          echo "📁 Estrutura de arquivos:"
          find . -name "*.html" -o -name "*.js" -o -name "*.css" | head -20
          echo ""
          echo "📦 Conteúdo da pasta deploy-files:"
          ls -la deploy-files/
          echo ""
          echo "📊 Arquivos para deploy:"
          find deploy-files/ -type f | head -20

      - name: Deploy to Cloud Storage
        run: |
          # Determina ambiente
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BUCKET="zenvus-app-prod"
            echo "🚀 Deploying to PRODUCTION"
          else
            BUCKET="zenvus-app-staging"
            echo "🧪 Deploying to STAGING"
          fi
          
          # Cria bucket se não existir
          if ! gsutil ls gs://$BUCKET 2>/dev/null; then
            echo "Creating bucket: $BUCKET"
            gsutil mb -l us-central1 gs://$BUCKET
            gsutil web set -m index.html -e index.html gs://$BUCKET
            gsutil iam ch allUsers:objectViewer gs://$BUCKET
          fi
          
          # Deploy dos arquivos
          echo "📤 Deploying files from: $(pwd)/deploy-files"
          gsutil -m rsync -R ./deploy-files/ gs://$BUCKET/
          
          # Configura cache
          echo "⚙️ Configuring cache headers..."
          gsutil -m setmeta -h "Cache-Control:no-cache, max-age=0" \
            gs://$BUCKET/*.html
          
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" \
            gs://$BUCKET/*.js \
            gs://$BUCKET/*.css \
            gs://$BUCKET/*.woff2 \
            gsutil -m setmeta -h "Cache-Control:public, max-age=31536000" \
            gs://$BUCKET/assets/**
          
          # Invalidar cache do CDN (se usando Cloud CDN)
          echo "🔄 Invalidating cache..."
          gsutil -m rm "gs://$BUCKET/**"  # Isso força atualização
          
          echo "✅ Deployment successful!"
          echo "🌐 URL: https://storage.googleapis.com/$BUCKET/index.html"
          echo "🔗 Acesse: https://$BUCKET.web.app (se configurado)"