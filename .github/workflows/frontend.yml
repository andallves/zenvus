name: Deploy Frontend to GCP

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'ui/**'  # Monitora mudanças no diretório ui/
  pull_request:
    branches: [ "main", "development" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  NODE_VERSION: '20'
  BUCKET_NAME: 'zenvus-app-${{ github.ref == ''refs/heads/main'' && ''prod'' || ''staging'' }}'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'  # CORRIGIDO: ui/ em vez de frontend/

      - name: Install dependencies
        working-directory: ./ui  # CORRIGIDO: Trabalha no diretório ui/
        run: npm install --legacy-peer-deps

      - name: Run lint and tests
        working-directory: ./ui
        continue-on-error: true
        run: |
          npm run lint || echo "Lint completed"
          npm test:ci  || echo "Tests completed"

      - name: Build Angular
        working-directory: ./ui
        run: |
          npm run build:dev
        env:
          NG_APP_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.API_URL_PROD || secrets.API_URL_STAGING }}
          NG_APP_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          NG_APP_VERSION: ${{ github.sha }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: ui/dist/ui/**  # CORRIGIDO: ui/dist/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: gcp-staging

    steps:
    - name: Debug - Verificar execução
      run: |
        echo "🚀 Iniciando deploy..."
        echo "Event: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Branch: ${GITHUB_REF#refs/heads/}"

    - uses: actions/checkout@v4

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    # Gcloud
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Verify auth
      run: gcloud auth list

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: angular-build
        path: ./deploy-files

    - name: Verify downloaded files
      run: |
        echo "📁 Arquivos para deploy:"
        find ./deploy-files -type f -name "*.html" | head -5
        ls -la ./deploy-files/

    - name: Deploy to Cloud Storage
      run: |
        # Determina ambiente
        if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          BUCKET="zenvus-app-prod"
          echo "🚀 Deploying to PRODUCTION"
        else
          BUCKET="zenvus-app-staging"
          echo "🧪 Deploying to STAGING"
        fi
    
        echo "📦 Bucket: $BUCKET"
        echo "🔧 Projeto: ${{ secrets.GCP_PROJECT }}"
    
        # Verifica se bucket existe
        if ! gsutil ls gs://$BUCKET 2>/dev/null; then
          echo "📁 Creating bucket: $BUCKET"
          gsutil mb -l us-central1 gs://$BUCKET
          gsutil web set -m index.html -e index.html gs://$BUCKET
          gsutil iam ch allUsers:objectViewer gs://$BUCKET
          echo "✅ Bucket criado e configurado"
        else
          echo "✅ Bucket já existe"
        fi
    
        # Faz deploy
        echo "📤 Uploading files..."
        gsutil -m rsync -d -r ./deploy-files/browser/ gs://$BUCKET/
    
        # Configura cache
        echo "⚙️ Configuring cache headers..."
        gsutil -m setmeta -h "Cache-Control:no-cache, max-age=0" \
          gs://$BUCKET/*.html 2>/dev/null || true
    
        gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" \
          gs://$BUCKET/*.js \
          gs://$BUCKET/*.css \
          gs://$BUCKET/*.woff2 2>/dev/null || true
    
        echo "✅ Deployment successful!"
        echo "🌐 URL: https://storage.googleapis.com/$BUCKET/index.html"
        echo "🔗 Ou: http://$BUCKET.storage.googleapis.com"