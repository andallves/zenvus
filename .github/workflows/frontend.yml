name: Deploy Frontend - Cloud Run

on:
  push:
    branches: [ "main", "development" ]
    paths:
      - 'ui/**' # Só roda se mexer na pasta UI
  pull_request:
    branches: [ "main", "development" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  REGION: us-central1
  REPO_NAME: zenvus-ux  # Nome do repositório criado no Passo 1

jobs:
  build-and-deploy:
    # Só faz deploy se for push (PR apenas testa o build se quiser)
  
    runs-on: ubuntu-latest
    environment: gcp-staging

    steps:
      - uses: actions/checkout@v4

      # 1. Autenticação Google
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # 2. Setup GCloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 3. Configura Docker
      - name: Configure Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # 4. Define variáveis dinâmicas (Nome do serviço e Tag)
      - name: Set Environment Variables
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "SERVICE_NAME=zenvus-ux-prod" >> $GITHUB_ENV
            echo "ENV_TAG=prod" >> $GITHUB_ENV
          else
            echo "SERVICE_NAME=zenvus-ux-staging" >> $GITHUB_ENV
            echo "ENV_TAG=staging" >> $GITHUB_ENV
          fi
          
          echo "IMAGE_TAG=us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/frontend:${SHORT_SHA}" >> $GITHUB_ENV

      # 5. Build e Push da Imagem
      - name: Build and Push Container
        working-directory: ./ui
        run: |
          echo "🔨 Building Docker Image..."
          docker build -t ${{ env.IMAGE_TAG }} .
          
          echo "📤 Pushing to Artifact Registry..."
          docker push ${{ env.IMAGE_TAG }}

      # 6. Deploy no Cloud Run
      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying to ${{ env.SERVICE_NAME }}..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_TAG }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 80 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --quiet

      # 7. Exibe a URL final
      - name: Show URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "✅ Deployed successfully to: $URL"