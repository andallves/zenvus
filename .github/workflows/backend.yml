name: Deploy Backend - Cloud Run

on:
  push:
    branches: [ "development" ]
    paths:
      - "server/**"

jobs:
  deploy:
    name: Setup Gcloud Account
    runs-on: ubuntu-latest
    environment: gcp-staging
    
    env: 
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
      SERVICE_NAME: zenvus-api
      IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/zenvus-api/zenvus-api

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Auth
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    # Gcloud
    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
    
    - name: Verify auth
      run: gcloud auth list

    # Docker
    - name: Configure Docker
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build Docker Image
      run: docker build -t $IMAGE_NAME -f server/deployment/Dockerfile server

    
    - name: Push Docker Image
      run: docker push $IMAGE_NAME
      
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy zenvus-api \
          --image $IMAGE_NAME \
          --region $REGION \
          --memory 512Mi
          --min-instances 0
          --max-instances 1
          --platform managed \
          --port 8080
          --allow-unauthenticated \
          --add-cloudsql-instances ${{ secrets.CLOUD_INSTANCE }} \
          --set-env-vars ASPNETCORE_ENVIRONMENT=${{ secrets.ENVIRONMENT }} \
          --set-env-vars ConnectionStrings__MYSQL=${{ secrets.DB_CONNECTION_STRING }}
